apiVersion: apps/v1
kind: Deployment
metadata:
  name: paseo-relay
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paseo-relay
  template:
    metadata:
      labels:
        app: paseo-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: paseo-relay
          image: ghcr.io/zenghongtu/paseo-relay:0.5.0
          env:
            - name: LOG_FORMAT
              value: json
          ports:
            - name: http
              containerPort: 8411
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
