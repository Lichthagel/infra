litellm-helm:
  replicaCount: 1
  # Avoid overlapping pods using the local ReadWriteOnce authentication volume.
  strategy:
    type: Recreate

  podSecurityContext:
    fsGroup: 65534

  volumes:
    - name: provider-auth
      persistentVolumeClaim:
        claimName: litellm-provider-auth

  volumeMounts:
    - name: provider-auth
      mountPath: /var/lib/litellm/provider-auth

  # Configure each file-based provider to use its own directory on the volume.
  envVars:
    CHATGPT_TOKEN_DIR: /var/lib/litellm/provider-auth/chatgpt
  image:
    repository: ghcr.io/berriai/litellm-database
    pullPolicy: IfNotPresent
    tag: "v1.104.2"

  masterkeySecretName: litellm-masterkey
  masterkeySecretKey: masterkey

  db:
    useExisting: true
    deployStandalone: false
    endpoint: postgres.postgres.svc.cluster.local
    database: litellm
    secret:
      name: litellm-db
      usernameKey: username
      passwordKey: password

  redis:
    enabled: false

  environmentSecrets:
    - litellm-env

  proxy_config:
    model_list: []
    general_settings:
      store_model_in_db: true
      disable_env_credential_login: true
    router_settings:
      redis_host: "valkey.valkey.svc.cluster.local"
      redis_port: 6379
      redis_password: os.environ/REDIS_PASSWORD
