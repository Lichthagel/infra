apiVersion: apps/v1
kind: Deployment
metadata:
  name: parakeet-redux
  namespace: parakeet-redux
  labels:
    app: parakeet-redux
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: parakeet-redux
  template:
    metadata:
      labels:
        app: parakeet-redux
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: sumireko
      containers:
        - name: parakeet-redux
          image: python:3.15-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - /bin/sh
            - -c
          args:
            - >-
              python -m pip install --no-cache-dir --extra-index-url
              https://download.pytorch.org/whl/cpu torch==2.10.0+cpu &&
              python -m pip install --no-cache-dir fastapi==0.116.1
              python-multipart==0.0.20 uvicorn==0.35.0 kestrel==0.9.2 &&
              exec python -m uvicorn server:app --host 0.0.0.0 --port 8000
          env:
            - name: HF_HOME
              value: /models/huggingface
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
            - name: OMP_WAIT_POLICY
              value: passive
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 8Gi
          volumeMounts:
            - name: server
              mountPath: /app
              readOnly: true
            - name: model-cache
              mountPath: /models
      volumes:
        - name: server
          configMap:
            name: parakeet-redux-server
        - name: model-cache
          hostPath:
            path: /mnt/data/models
            type: DirectoryOrCreate
